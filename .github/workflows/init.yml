name: Init / Doctor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doctor:
    name: Check labels and secrets
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      # Labels are assumed to exist everywhere else; run this once after
      # enabling Actions (or whenever a label goes missing).
      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for L in ai-needs-review ai-passed-review ai-failed-review ai-needs-human ai-review-error main-broken backlog cost-tracker; do
            OUTPUT=$(gh label create "$L" --repo "$GITHUB_REPOSITORY" 2>&1) && CREATED=1 || CREATED=0
            if echo "$OUTPUT" | grep -q "already exists"; then
              echo "label ok: $L"
            else
              echo "  created: $L"
            fi
          done

      - name: Check secrets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          OMP_MODEL: ${{ secrets.OMP_MODEL }}
          OMP_MODELS_YAML: ${{ secrets.OMP_MODELS_YAML }}
        run: |
          HAVE_PROVIDER=""
          for S in ANTHROPIC_API_KEY OPENAI_API_KEY DEEPSEEK_API_KEY OPENCODE_API_KEY GEMINI_API_KEY OPENROUTER_API_KEY XAI_API_KEY LITELLM_API_KEY; do
            VAL="${!S}"
            if [ -n "$VAL" ]; then
              echo "secret ok: $S"
              HAVE_PROVIDER=1
            fi
          done
          if [ -z "$HAVE_PROVIDER" ]; then
            echo "::error::no AI provider key configured - set at least one of: ANTHROPIC_API_KEY OPENAI_API_KEY DEEPSEEK_API_KEY OPENCODE_API_KEY GEMINI_API_KEY OPENROUTER_API_KEY XAI_API_KEY LITELLM_API_KEY"
          fi

          for S in OMP_MODEL OMP_MODELS_YAML; do
            VAL="${!S}"
            if [ -n "$VAL" ]; then
              echo "secret ok: $S"
            else
              echo "::warning::optional secret not set: $S"
            fi
          done

          [ -n "$HAVE_PROVIDER" ] || { echo "Run init again after adding a provider key."; exit 1; }

      - name: Ensure cost-tracker issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --label cost-tracker --state open --json number -q '.[0].number // empty' || true)
          if [ -n "$EXISTING" ]; then
            echo "cost-tracker issue ok: #$EXISTING"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "AI cost tracker" \
              --label cost-tracker \
              --body "Cumulative AI cost tracking for NozzleBench workflows.

              | Timestamp | Run type | Cumulative | Delta | Requests | Cache |
              |-----------|----------|------------|-------|----------|-------|

              _This issue is auto-updated by the cost-tracking action after every omp run._"
            echo "created cost-tracker issue"
          fi

      - name: Check GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            echo "pages ok: enabled"
          else
            echo "::warning::GitHub Pages is not enabled - enable it with 'GitHub Actions' as the build source so main.yml can deploy the web app"
          fi
